<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Talk to Terminal</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111417;
    --panel: #1a1e23;
    --border: #2a2f36;
    --text: #e8eaed;
    --muted: #8a919c;
    --accent: #3b82f6;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  /* Elements like #auth-bar and .row also set their own `display`, which
     has equal-or-higher CSS specificity than the browser's default
     `[hidden] { display: none }` rule and silently wins — so `hidden`
     must be forced here or JS-driven hide/show does nothing visually. */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, system-ui, sans-serif;
    padding-bottom: 48px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  h1 { font-size: 18px; margin: 0; }
  #auth-gear {
    padding: 8px 10px;
    font-size: 16px;
    line-height: 1;
  }

  #auth-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #auth-bar input {
    flex: 1;
    min-width: 0;
  }

  input, textarea, button {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  button {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: #23282f; }

  textarea#dictate-text {
    width: 100%;
    height: 110px;
    resize: vertical;
    margin-bottom: 8px;
  }
  .dictate-row {
    display: flex;
    gap: 8px;
  }
  .btn-wide {
    flex: 1;
    padding: 14px;
    font-weight: 600;
  }
  #dictate-send-enter {
    width: 100%;
    padding: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  hr.divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  .section-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 8px;
  }

  .nav-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-areas:
      ".    up   ."
      "esc  .    tab"
      ".    down .";
    gap: 8px;
    margin-bottom: 12px;
  }
  .nav-grid button {
    padding: 18px 8px;
    font-weight: 600;
    font-size: 18px;
  }
  .nav-grid [data-key="up"]   { grid-area: up; }
  .nav-grid [data-key="down"] { grid-area: down; }
  .nav-grid [data-key="esc"]  { grid-area: esc; font-size: 15px; }
  .nav-grid [data-key="tab"]  { grid-area: tab; font-size: 15px; }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .btn-secondary {
    flex: 1 1 18%;
    min-width: 56px;
    padding: 10px 4px;
    font-size: 13px;
    color: var(--muted);
  }

  .accordion-toggle {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 8px 0;
    color: var(--muted);
    font-size: 13px;
  }

  .macro-chip {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    flex: 1 1 42%;
    min-width: 110px;
  }
  .macro-chip button.macro-run {
    flex: 1;
    border: none;
    border-radius: 0;
    padding: 12px 8px;
    font-weight: 600;
    font-size: 14px;
  }
  .macro-chip button.macro-remove {
    border: none;
    border-left: 1px solid var(--border);
    border-radius: 0;
    padding: 0 12px;
    color: var(--danger);
  }
  #macro-add {
    flex: 1 1 42%;
    min-width: 110px;
    padding: 12px 8px;
    color: var(--muted);
    border-style: dashed;
  }

  .history-chip {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    flex: 1 1 100%;
  }
  .history-chip button.history-load {
    flex: 1;
    border: none;
    border-radius: 0;
    padding: 10px 12px;
    text-align: left;
    font-weight: 400;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #history-empty {
    font-size: 13px;
    color: var(--muted);
    padding: 4px 0;
  }

  #status {
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
  }
  #status.error { color: var(--danger); }
</style>
</head>
<body>

<div class="header">
  <h1>Talk to Terminal</h1>
  <button id="auth-gear" aria-label="Secret settings">⚙</button>
</div>

<div id="auth-bar" hidden>
  <input id="auth-input" type="password" placeholder="Shared secret" autocomplete="off">
  <button id="auth-save">Save</button>
</div>

<textarea id="dictate-text" autofocus placeholder="Type or dictate here (tap the mic on the keyboard), then Send."></textarea>
<button id="dictate-send-enter">Send &amp; Enter</button>
<div class="dictate-row">
  <button id="dictate-send" class="btn-wide">Send</button>
  <button id="dictate-enter" class="btn-wide" data-key="enter">Enter</button>
</div>

<button id="history-toggle" class="accordion-toggle">&#9656; History</button>
<div class="row" id="history-row" hidden>
  <div id="history-empty">Nothing sent yet.</div>
  <!-- history chips injected here -->
</div>

<hr class="divider">

<div class="section-label">Navigate</div>
<div class="nav-grid">
  <button data-key="up">&uarr;</button>
  <button data-key="esc">Esc</button>
  <button data-key="tab">Tab</button>
  <button data-key="down">&darr;</button>
</div>
<div class="row">
  <button class="btn-secondary" data-key="shift+tab">Shift+Tab</button>
  <button class="btn-secondary" data-key="ctrl+c">Ctrl+C</button>
  <button class="btn-secondary" id="btn-clear-line">Clear</button>
  <button class="btn-secondary" data-key="1">1</button>
  <button class="btn-secondary" data-key="2">2</button>
  <button class="btn-secondary" data-key="3">3</button>
</div>

<button id="macros-toggle" class="accordion-toggle">&#9656; Macros</button>
<div class="row" id="macro-row" hidden>
  <!-- macro chips injected here -->
  <button id="macro-add">+ Add</button>
</div>
<div class="row" id="macro-add-row" hidden>
  <input id="macro-add-input" type="text" placeholder="/help" style="flex:1 1 60%;">
  <button id="macro-add-confirm" style="flex:0 0 auto;">Add</button>
  <button id="macro-add-cancel" class="btn-secondary" style="flex:0 0 auto;">Cancel</button>
</div>

<div id="status"></div>

<script>
(function () {
  "use strict";

  var TOKEN_KEY = "dictationAuth";

  function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
  function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
  function clearToken() { localStorage.removeItem(TOKEN_KEY); }

  var authGear = document.getElementById("auth-gear");
  var authBar = document.getElementById("auth-bar");
  var authInput = document.getElementById("auth-input");
  var authSave = document.getElementById("auth-save");
  var statusEl = document.getElementById("status");

  // No persistent "connected" banner once a secret is saved — the gear
  // icon is the only permanent trace, matching it stays out of the way.
  function renderAuth() {
    authBar.hidden = !!getToken();
  }

  authGear.addEventListener("click", function () {
    authBar.hidden = !authBar.hidden;
    if (!authBar.hidden) authInput.focus();
  });

  authSave.addEventListener("click", function () {
    var v = authInput.value.trim();
    if (!v) return;
    setToken(v);
    authInput.value = "";
    authBar.hidden = true;
    loadMacros();
  });

  function setStatus(msg, isError) {
    statusEl.textContent = msg || "";
    statusEl.className = isError ? "error" : "";
  }

  // Thin fetch wrapper: attaches X-Auth, and on 401 clears the stored
  // token and re-prompts rather than silently failing.
  function apiFetch(path, opts) {
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers["X-Auth"] = getToken();
    return fetch(path, opts).then(function (res) {
      if (res.status === 401) {
        clearToken();
        authBar.hidden = false;
        setStatus("Wrong or expired secret — enter it again.", true);
        throw new Error("unauthorized");
      }
      return res;
    });
  }

  // --- dictate ---

  var dictateText = document.getElementById("dictate-text");
  var dictateSend = document.getElementById("dictate-send");
  var dictateSendEnter = document.getElementById("dictate-send-enter");

  function doType(text) {
    return apiFetch("/type", { method: "POST", body: text }).then(function (res) {
      if (!res.ok) throw new Error("send failed (" + res.status + ")");
    });
  }

  dictateSend.addEventListener("click", function () {
    var text = dictateText.value;
    if (!text.trim()) return;
    dictateSend.disabled = true;
    doType(text)
      .then(function () {
        pushHistory(text);
        dictateText.value = "";
        setStatus("Sent.");
      })
      .catch(function (err) {
        if (err.message !== "unauthorized") setStatus(err.message, true);
      })
      .finally(function () {
        dictateSend.disabled = false;
        // Refocus so the keyboard stays up for the next dictation — only
        // the mic tap is needed next time, not tap-box-then-tap-mic again.
        dictateText.focus();
      });
  });

  // Combined action for text you already know is final — types it, then
  // immediately confirms with Enter, in one tap.
  dictateSendEnter.addEventListener("click", function () {
    var text = dictateText.value;
    if (!text.trim()) return;
    dictateSendEnter.disabled = true;
    doType(text)
      .then(function () { return sendKey("enter"); })
      .then(function () {
        pushHistory(text);
        dictateText.value = "";
        setStatus("Sent + Enter.");
      })
      .catch(function (err) {
        if (err.message !== "unauthorized") setStatus(err.message, true);
      })
      .finally(function () {
        dictateSendEnter.disabled = false;
        dictateText.focus();
      });
  });

  // --- key-combo buttons (nav grid, secondary row, dictate's Enter) ---

  document.querySelectorAll("[data-key]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      sendKey(btn.getAttribute("data-key"));
    });
  });

  function sendKey(action) {
    return apiFetch("/key", { method: "POST", body: action })
      .then(function (res) {
        if (!res.ok) throw new Error("key failed (" + res.status + ")");
        setStatus("Sent: " + action);
      })
      .catch(function (err) {
        if (err.message !== "unauthorized") setStatus(err.message, true);
      });
  }

  // Clears the current line on the host side — Ctrl+A/Delete doesn't work
  // for this because readline-based inputs (a shell, Claude Code's own
  // prompt) treat Ctrl+A as "jump to line start," not "select all." The
  // readline-correct way to wipe a line regardless of cursor position is
  // End, then kill-backward-to-start.
  document.getElementById("btn-clear-line").addEventListener("click", function () {
    sendKey("ctrl+e").then(function () { return sendKey("ctrl+u"); });
  });

  // --- macros (collapsed accordion) ---

  var macrosToggle = document.getElementById("macros-toggle");
  var macroRow = document.getElementById("macro-row");
  var macroAddBtn = document.getElementById("macro-add");
  var macroAddRow = document.getElementById("macro-add-row");

  macrosToggle.addEventListener("click", function () {
    var opening = macroRow.hidden;
    macroRow.hidden = !opening;
    macrosToggle.innerHTML = (opening ? "&#9662;" : "&#9656;") + " Macros";
    if (!opening) macroAddRow.hidden = true;
  });

  function loadMacros() {
    if (!getToken()) return;
    apiFetch("/macros")
      .then(function (res) { return res.json(); })
      .then(function (data) { renderMacros(data.macros || []); })
      .catch(function () { /* status already set by apiFetch on 401 */ });
  }

  function renderMacros(macros) {
    macroRow.querySelectorAll(".macro-chip").forEach(function (el) { el.remove(); });
    macros.forEach(function (m) {
      var chip = document.createElement("div");
      chip.className = "macro-chip";

      var run = document.createElement("button");
      run.className = "macro-run";
      run.textContent = m.text;
      run.addEventListener("click", function () { runMacro(m.text); });

      var remove = document.createElement("button");
      remove.className = "macro-remove";
      remove.textContent = "×";
      remove.setAttribute("aria-label", "Remove " + m.text);
      remove.addEventListener("click", function (e) {
        e.stopPropagation();
        removeMacro(m.id);
      });

      chip.appendChild(run);
      chip.appendChild(remove);
      macroRow.insertBefore(chip, macroAddBtn);
    });
  }

  function runMacro(text) {
    // Two calls, not one /type with a trailing newline: explicit
    // "type" then "submit" beats relying on _type()'s incidental
    // trailing-Return behavior for a single line. See project_spec.md,
    // Remote mode.
    return apiFetch("/type", { method: "POST", body: text })
      .then(function (res) {
        if (!res.ok) throw new Error("macro send failed (" + res.status + ")");
        return sendKey("enter");
      })
      .catch(function (err) {
        if (err.message !== "unauthorized") setStatus(err.message, true);
      });
  }

  var macroAddInput = document.getElementById("macro-add-input");
  var macroAddConfirm = document.getElementById("macro-add-confirm");
  var macroAddCancel = document.getElementById("macro-add-cancel");

  macroAddBtn.addEventListener("click", function () {
    macroAddRow.hidden = false;
    macroAddBtn.hidden = true;
    macroAddInput.value = "";
    macroAddInput.focus();
  });

  function closeAddRow() {
    macroAddRow.hidden = true;
    macroAddBtn.hidden = false;
  }
  macroAddCancel.addEventListener("click", closeAddRow);

  function submitNewMacro() {
    var text = macroAddInput.value.trim();
    if (!text) { closeAddRow(); return; }
    apiFetch("/macros", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text }),
    })
      .then(function (res) {
        if (!res.ok) throw new Error("add macro failed (" + res.status + ")");
        setStatus("Macro added.");
        closeAddRow();
        loadMacros();
      })
      .catch(function (err) {
        if (err.message !== "unauthorized") setStatus(err.message, true);
      });
  }
  macroAddConfirm.addEventListener("click", submitNewMacro);
  macroAddInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") submitNewMacro();
  });

  function removeMacro(id) {
    apiFetch("/macros/remove", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id }),
    })
      .then(function (res) {
        if (!res.ok) throw new Error("remove macro failed (" + res.status + ")");
        setStatus("Macro removed.");
        loadMacros();
      })
      .catch(function (err) {
        if (err.message !== "unauthorized") setStatus(err.message, true);
      });
  }

  // --- history: last 10 sent dictations, device-local (localStorage), so
  // text can be recalled and resent if it landed in the wrong focused
  // window and appeared "lost". Not synced to the server.

  var HISTORY_KEY = "dictationHistory";
  var HISTORY_MAX = 10;

  var historyToggle = document.getElementById("history-toggle");
  var historyRow = document.getElementById("history-row");
  var historyEmpty = document.getElementById("history-empty");

  historyToggle.addEventListener("click", function () {
    var opening = historyRow.hidden;
    historyRow.hidden = !opening;
    historyToggle.innerHTML = (opening ? "&#9662;" : "&#9656;") + " History";
    if (opening) renderHistory();
  });

  function loadHistoryLocal() {
    try {
      var raw = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      return Array.isArray(raw) ? raw : [];
    } catch (e) {
      return [];
    }
  }

  function pushHistory(text) {
    text = text.trim();
    if (!text) return;
    var hist = loadHistoryLocal().filter(function (t) { return t !== text; });
    hist.unshift(text);
    if (hist.length > HISTORY_MAX) hist = hist.slice(0, HISTORY_MAX);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
    if (!historyRow.hidden) renderHistory();
  }

  function renderHistory() {
    var hist = loadHistoryLocal();
    historyRow.querySelectorAll(".history-chip").forEach(function (el) { el.remove(); });
    historyEmpty.hidden = hist.length > 0;
    hist.forEach(function (text) {
      var chip = document.createElement("div");
      chip.className = "history-chip";

      var load = document.createElement("button");
      load.className = "history-load";
      load.textContent = text;
      load.title = "Tap to load into the text box";
      load.addEventListener("click", function () {
        dictateText.value = text;
        dictateText.focus();
        setStatus("Loaded into text box — review, then Send.");
      });

      chip.appendChild(load);
      historyRow.appendChild(chip);
    });
  }

  // --- init ---

  renderAuth();
  if (getToken()) loadMacros();
})();
</script>
</body>
</html>
